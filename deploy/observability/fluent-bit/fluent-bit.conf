# ============================================================================
#  Fluent Bit: сбор журналов подов MindLex и доставка в Victoria Logs.
#
#  Один и тот же файл используется:
#    * в DaemonSet внутри minikube (подставляется как ConfigMap);
#    * на локальном стенде проверки (Docker) — меняются только переменные окружения.
#
#  Пути к журналам задаются переменными окружения, значения по умолчанию — для Kubernetes.
# ============================================================================

[SERVICE]
    # Flush — как часто буфер уезжает в Victoria Logs. Одна секунда удобна для демонстрации:
    # записи появляются в vmui почти сразу после запроса к API.
    Flush         1
    # Grace — сколько ждать при остановке, чтобы успеть отправить накопленное.
    Grace         5
    Daemon        Off
    Log_Level     info
    # Стандартный набор парсеров (в нём же лежит парсер `docker` для строк containerd/dockerd)
    # и собственные парсеры. Путь указан относительно каталога этого файла
    # (/fluent-bit/etc), поэтому файл лежит в conf/parsers_extra.conf.
    Parsers_File  parsers.conf
    Parsers_File  conf/parsers_extra.conf
    # Встроенный http-сервер Fluent Bit — по нему видно состояние плагинов и метрики.
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    # В Kubernetes kubelet пишет журналы контейнеров в /var/log/pods, а в /var/log/containers
    # лежат симлинки с удобными именами (<pod>_<namespace>_<container>-<id>.log).
    # Тейлим каталог симлинков — так попадают журналы всех подов, включая приложение.
    Path              /var/log/containers/*.log
    Path_Key          source_file
    # Читаем с конца файла: позиция хранится в DB, поэтому перезапуск пода не приводит
    # к повторной отправке уже собранных записей. Для первого развёртывания, когда нужно
    # забрать историю из уже существующих файлов, поставьте On.
    Read_from_Head    false
    # Позиция чтения: после перезапуска пода файлы не перечитываются целиком.
    DB                /var/lib/fluent-bit/tail.db
    DB.Sync           Normal
    # Не собираем собственные журналы и журналы хранилища: иначе получим лавину
    # «логов о логах» и закольцованную обратную связь по нагрузке.
    Exclude_Path      /var/log/containers/fluent-bit-*.log,/var/log/containers/victoria-logs-*.log
    # Стек исключений Java — это несколько строк. Multiline-парсер склеивает их в одну запись,
    # иначе LogsQL показывал бы каждый кадр стека отдельным событием.
    Multiline.Parser  java_multiline
    Tag               kube.*
    Mem_Buf_Limit     16MB
    Skip_Long_Lines   On

[FILTER]
    # Обогащение метаданными Kubernetes: pod_name, namespace_name, container_name, labels.
    # Из них формируется поток (stream) в Victoria Logs.
    #
    # ВНИМАНИЕ: в локальном стенде (вне кластера) этот фильтр недоступен — там конфигурация
    # подключается без него (см. deploy/lab/README.md).
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           Off
    Keep_Log            Off
    K8S-Logging.Parser  Off
    K8S-Logging.Exclude Off
    Labels              Off
    Annotations         Off

[FILTER]
    # Строка от containerd/dockerd уже разобрана парсером `docker` в поля log/stream/time.
    # В поле log лежит JSON приложения — разбираем его, чтобы поля стали доступны LogsQL.
    Name           parser
    Match          kube.*
    Key_Name       log
    Parser         mindlex_json
    Reserve_Data   On
    Preserve_Key   Off

[FILTER]
    # Перенос времени события в @timestamp и нормализация уровня (см. scripts/prepare_record.lua).
    Name    lua
    Match   kube.*
    Script  /fluent-bit/etc/conf/scripts/prepare_record.lua
    Call    prepare

[OUTPUT]
    # Victoria Logs принимает журналы по ES-bulk API: формат тот же, что у Elasticsearch
    # (строка действия + строка документа), поэтому используется штатный плагин `es`.
    Name               es
    Match              kube.*
    Host               victoria-logs
    Port               9428
    TLS                Off
    # Путь приёма вместе с параметрами Victoria Logs:
    #   _msg_field     — поле с текстом записи (message из JSON приложения);
    #   _time_field    — поле со временем события (его заполняет lua-фильтр);
    #   _stream_fields — поля, образующие поток. Взяты namespace, pod, container и
    #                    service.name: по ним удобно ограничивать выборку, а число
    #                    сочетаний невелико. Поле request_id в поток не входит, иначе
    #                    каждый HTTP-запрос создавал бы отдельный поток.
    #
    # Параметры записаны в Path, а не в Pipeline: при заданном Pipeline плагин формирует
    # путь "%s/_bulk/?pipeline=%s" (с косой чертой), и Victoria Logs отвечает
    # 400 unsupported path requested. По той же причине не используется Logstash_Format.
    Path               /insert/elasticsearch/_bulk?_msg_field=message&_time_field=@timestamp&_stream_fields=namespace_name,pod_name,container_name,service.name
    # Write_Operation create даёт строку действия {"create":{}}. Вариант upsert требует
    # Generate_Id или Id_Key, и тогда в строку действия добавляется идентификатор документа;
    # Victoria Logs читает только строки с документами, метаданные действия ей не нужны.
    Write_Operation    create
    # Без этого плагин добавит в строку действия _type, которого Victoria Logs не ожидает.
    Suppress_Type_Name On
    # Имя индекса в терминах Elasticsearch. Victoria Logs принимает любое значение
    # и сохраняет его в служебном поле _index.
    Index              mindlex
    # Ограниченное число повторов: при недоступном хранилище Fluent Bit не должен
    # бесконечно накапливать буфер и расходовать память узла.
    Retry_Limit        5
