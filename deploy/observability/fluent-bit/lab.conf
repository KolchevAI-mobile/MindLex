# ============================================================================

[SERVICE]
    Flush                1
    Grace                5
    Daemon               Off
    Log_Level            info
    Parsers_File         /fluent-bit/etc/parsers.conf
    Parsers_File         /fluent-bit/etc/conf/parsers_extra.conf
    HTTP_Server          On
    HTTP_Listen          0.0.0.0
    HTTP_Port            2020

[INPUT]
    Name              tail
    # ????????????????: Fluent Bit ???????????????? ???????????? ${VAR}, ?????? ???????????????? ???? ??????????????????.
    # ???????????????? ???????????????? ???????????????????? ???????????????????? ?? deploy/lab/docker-compose.yml.
    Path              ${LOG_GLOB}
    Path_Key          source_file
    # ???????????? ?? ?????????? ??????????: ?????????????? ???????????????? ?? TAIL_DB, ?????????????? ???????????????????? ????????
    # ???? ???????????????? ?? ?????????????????? ???????????????? ?????? ?????????????????? ??????????????. ?????????? ?????????????? ??????????????
    # (????????????????, ?????? ???????????? ??????????????????????????) ??? ?????????????????? On ?? ?????????????? ???????? TAIL_DB.
    Read_from_Head    true
    DB                ${TAIL_DB}
    DB.Sync           Normal
    Exclude_Path      ${LOG_EXCLUDE}
    Multiline.Parser  java_multiline
    Tag               kube.*
    Mem_Buf_Limit     16MB
    Skip_Long_Lines   On

[FILTER]
    # ???????????? ???????????? ?????????????? ????????????????????: ?? ???????? log ?????????? JSON ????????????????????.
    Name           parser
    Match          kube.*
    Key_Name       log
    Parser         mindlex_json
    Reserve_Data   On
    Preserve_Key   Off

[FILTER]
    # ???????????? ???????????????????? Kubernetes ???? ????????????. ???????????????? ?????????????????? ?? ??????, ?????? ?????????????????? ????
    # ???????????? kubernetes ?? ????????????????, ?????????????? _stream_fields ?????????????????? ?????? ?????????? ??????????????????.
    Name        modify
    Match       kube.*
    Add         namespace_name mindlex
    Add         pod_name       mindlex-api-stand
    Add         container_name mindlex-api
    Add         node_name      stand

[FILTER]
    Name    lua
    Match   kube.*
    Script  /fluent-bit/etc/conf/scripts/prepare_record.lua
    Call    prepare

[OUTPUT]
    Name               es
    Match              kube.*
    Host               ${VL_HOST}
    Port               ${VL_PORT}
    TLS                Off
    # ?????????????? ???????? ???? ES-???????????????????????? ????????????. ?????????????????? Victoria Logs ???????????????? ??????????
    # ?? ???????? (????. ?????????????????? ????????) ??? ?????? ???????????????????? ?????????? "/insert/elasticsearch/_bulk?..."
    Path               /insert/elasticsearch/_bulk?_msg_field=message&_time_field=@timestamp&_stream_fields=namespace_name,pod_name,container_name,service.name
    # ??????????: ?????????? Pipeline ???? ????????????????. ???????????? `es` ?????????? ?????????????????? "?pipeline=<????????????????>",
    # ???? ???????????? ???????????? ?? ?????????? ????????????: "%s/_bulk/?pipeline=%s". Victoria Logs ?????????? ????????
    # ("/insert/elasticsearch/_bulk/") ?????????????????? ?????????????? 400 unsupported path requested.
    # ?????????????? query-?????????????????? ???????????? ?????????????? ?? Path, ?? Logstash_Format ???????? ????????????????:
    # ?? ???????? ???????????? ???????? ?????????????????????? ?????? "%s/_bulk/%s-%s".
    Write_Operation    create
    Suppress_Type_Name On
    Index              mindlex
    # Logstash_Format ?????????????????? ???? ????????????????????: ?? ???????? ???????????? ???????????? ???????????? ???????????? ????????
    # <prefix>-<????????>, ????-???? ???????? ???????? ???????????????????? "/_bulk/", ?? Victoria Logs ?????????? ????????
    # (?? ?????????? ????????????) ?????????????????? ?????????????? 400 unsupported path requested.
    Retry_Limit        5

