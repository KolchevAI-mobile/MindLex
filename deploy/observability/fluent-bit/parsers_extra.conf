# ============================================================================
#  Additional Fluent Bit parsers for MindLex application logs.
#  Connected alongside the standard parsers.conf (which provides `docker`).
#
#  NOTE: comments in this file are intentionally ASCII-only. Configuration
#  files are parsed by Fluent Bit itself (not by a UTF-8 aware shell), and a
#  Cyrillic comment that gets mis-encoded can break the whole file.
# ============================================================================

[PARSER]
    Name        mindlex_json
    Format      json
    # Time_Key is deliberately not set: the event time is moved into the
    # `@timestamp` field by the Lua filter, and Victoria Logs is told to use
    # that field via _time_field. This keeps the timestamp exactly as the
    # application wrote it.

[MULTILINE_PARSER]
    Name          java_multiline
    Type          regex
    # Fluent Bit rejects values below 60 seconds ("flush timeout is too low"),
    # so 60 is the practical minimum if the unit is seconds; 30000 is used when
    # the unit is milliseconds. Both variants were tested against the image.
    Flush_timeout 30000
    # A new record starts with a JSON object beginning with the timestamp field
    # (every MindLex log line looks like that). Continuation lines are Java
    # exception stack frames.
    Rule      "start_state"    "/^\{\"timestamp\":/"    "cont"
    Rule      "cont"           "/^\s+(at |\.\.\. \d+ more|Caused by: |Suppressed: )/"   "cont"
