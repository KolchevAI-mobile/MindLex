# ============================================================================
#  Victoria Logs (single-node) — хранилище журналов.
#
#  Способ развёртывания: собственные манифесты (Deployment + Service + PVC),
#  без Helm. Причина выбора:
#    * в minikube нет helm «из коробки», а официальный chart victoria-logs-single
#      разворачивает ещё и vmagent/оператор — для учебной задачи это лишние сущности;
#    * single-node режим — это один процесс с одной БД, поэтому StatefulSet
#      с шаблоном томов не нужен, достаточно Deployment и PVC.
#
#  Что важно в конфигурации:
#    * -storageDataPath=/victoria-logs-data — на этот каталог монтируется PVC;
#    * -httpListenAddr=:9428 — в официальном образе сервер по умолчанию слушает
#      только localhost, поэтому флаг обязателен, иначе под будет «здоров», но
#      недоступен снаружи;
#    * -retentionPeriod=7d — минимально допустимый срок хранения (меньше нельзя).
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-logs-data
  namespace: mindlex
  labels:
    app.kubernetes.io/name: victoria-logs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  namespace: mindlex
  labels:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/component: logging
spec:
  replicas: 1
  strategy:
    # Один экземпляр и один диск: второй под не должен подниматься параллельно.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs
        app.kubernetes.io/component: logging
    spec:
      # Хранилищу не нужны права на API Kubernetes.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.26.0
          imagePullPolicy: IfNotPresent
          args:
            - -storageDataPath=/victoria-logs-data
            - -retentionPeriod=7d
            # Обязательно: иначе сервер слушает только внутри контейнера.
            - -httpListenAddr=:9428
          ports:
            - name: http
              containerPort: 9428
          volumeMounts:
            - name: data
              mountPath: /victoria-logs-data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoria-logs-data
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: mindlex
  labels:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/component: logging
spec:
  # ClusterIP достаточно: доступ к vmui и API — через kubectl port-forward.
  # Для внешнего доступа можно заменить на NodePort (minikube service victoria-logs -n mindlex).
  type: ClusterIP
  selector:
    app.kubernetes.io/name: victoria-logs
  ports:
    - name: http
      port: 9428
      targetPort: http
