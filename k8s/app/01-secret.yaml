# ============================================================================
#  Секреты приложения MindLex.
#
#  Значения заданы прямо в манифесте, чтобы развёртывание в учебном кластере
#  воспроизводилось одной командой. В эксплуатации секрет создаётся отдельно
#  (kubectl create secret или внешнее хранилище секретов), а в репозитории
#  хранится только шаблон:
#
#     kubectl -n mindlex create secret generic mindlex-secrets \
#       --from-literal=MINDLEX_DB_PASSWORD=<пароль> \
#       --from-literal=MINDLEX_JWT_SECRET=<секрет> \
#       --dry-run=client -o yaml | kubectl apply -f -
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mindlex-secrets
  namespace: mindlex
  labels:
    app.kubernetes.io/name: mindlex
type: Opaque
stringData:
  MINDLEX_DB_USER: mindlex
  MINDLEX_DB_PASSWORD: mindlex
  # Не короче 32 байт — требование библиотеки JJWT.
  MINDLEX_JWT_SECRET: change-me-in-production-0123456789abcdef
