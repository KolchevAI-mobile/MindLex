# ============================================================================
#  Бэкенд MindLex — источник журналов для Victoria Logs.
#
#  Сборка образа выполняется в Docker-демоне minikube (см. runbook):
#     minikube image build -t mindlex-api:1.0.0 ./backend
#  При imagePullPolicy: IfNotPresent под не пойдёт в реестр и возьмёт локальный образ.
#
#  Именно stdout этих подов собирает Fluent Bit и отправляет в Victoria Logs.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindlex-api
  namespace: mindlex
  labels:
    app.kubernetes.io/name: mindlex-api
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mindlex-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mindlex-api
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: api
          image: mindlex-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: MINDLEX_DB_URL
              value: jdbc:postgresql://mindlex-db:5432/mindlex
            - name: MINDLEX_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mindlex-secrets
                  key: MINDLEX_DB_USER
            - name: MINDLEX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mindlex-secrets
                  key: MINDLEX_DB_PASSWORD
            - name: MINDLEX_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mindlex-secrets
                  key: MINDLEX_JWT_SECRET
            # Уровни журналирования: задаются окружением (фактор III).
            - name: MINDLEX_LOG_LEVEL
              value: INFO
            - name: MINDLEX_APP_LOG_LEVEL
              value: INFO
            # Формат журнала — JSON (см. backend/src/main/resources/logback-spring.xml).
            # Профиль plain переключает вывод на прежний текстовый шаблон,
            # что полезно только при ручной отладке в консоли.
            - name: SPRING_PROFILES_ACTIVE
              value: json
            - name: MINDLEX_CORS_ORIGINS
              value: http://localhost:3000,http://localhost:5173
            - name: MINDLEX_DEMO_USER_ENABLED
              value: "true"
          # Пробы не журналируются (фильтр RequestLoggingFilter пропускает /actuator/**),
          # иначе каждые несколько секунд в журнал попадал бы мусор и вытеснял полезные записи.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mindlex-api
  namespace: mindlex
  labels:
    app.kubernetes.io/name: mindlex-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mindlex-api
  ports:
    - name: http
      port: 8080
      targetPort: http
